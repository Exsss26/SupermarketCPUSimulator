<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KoPPink Guide Book</title>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg1:#e2b9f2;--bg2:#f6d6ea;--paper:#fff8fc;--ink:#6d2255;--soft:#a85a8c;--pink:#e0629f;--line:#f0c4dc;--cell:#fbe6f1;--cover:#e0629f;--cov2:#c24c88;
--p1:#e06aa8;--p2:#b36ad9;--p3:#8b9be0;--p4:#f0a85a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2b1936;--bg2:#3d2146;--paper:#3a2443;--ink:#fbdcee;--soft:#d79bc2;--line:#5d3a6a;--cell:#47294f;--cover:#b8467f;--cov2:#8f3463}}
:root[data-theme="dark"]{--bg1:#2b1936;--bg2:#3d2146;--paper:#3a2443;--ink:#fbdcee;--soft:#d79bc2;--line:#5d3a6a;--cell:#47294f;--cover:#b8467f;--cov2:#8f3463}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;min-height:100%;font-family:"Pixelify Sans",ui-monospace,Consolas,monospace;color:var(--ink);background:linear-gradient(var(--bg1),var(--bg2)) fixed;display:flex;flex-direction:column;align-items:center;padding:14px 10px 18px}
h1{font-size:1.05rem;margin:2px 0 10px;letter-spacing:.5px}
.book{perspective:1800px;width:min(1000px,100%);display:flex;border-radius:16px;background:var(--pink);padding:10px;box-shadow:0 10px 0 var(--cov2),0 18px 30px #0003}
.pg{flex:1;min-width:0;height:min(74vh,580px);background:var(--paper);overflow-y:auto;padding:20px 22px;font-size:.92rem;line-height:1.45;border:2px solid var(--line);position:relative}
.pg.l{border-radius:10px 0 0 10px;transform-origin:right center;background-image:linear-gradient(90deg,transparent 94%,#d9a0c422)}
.pg.r{border-radius:0 10px 10px 0;transform-origin:left center;background-image:linear-gradient(270deg,transparent 94%,#d9a0c422)}
.pg.r:empty{background:var(--paper)}
.num{position:absolute;bottom:4px;font-size:.7rem;color:var(--soft)}.l .num{left:14px}.r .num{right:14px}
h2{font-size:1.2rem;margin:0 0 8px;color:var(--pink)}h3{font-size:.95rem;margin:12px 0 4px}
p{margin:6px 0}ol,ul{margin:6px 0;padding-left:20px}li{margin:3px 0}
table{border-collapse:collapse;width:100%;font-size:.78rem;margin:6px 0}
th,td{border:2px solid var(--line);padding:3px 5px;text-align:left}th{background:var(--cell)}
.tw{overflow-x:auto}
.fig{display:block;width:100%;max-width:460px;border:2px solid var(--line);border-radius:6px;margin:6px 0}
.note{background:var(--cell);border-left:4px solid var(--pink);padding:6px 9px;font-size:.8rem;margin:8px 0}
.cover{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;background:var(--cover);color:#fff;margin:-20px -22px;padding:20px;min-height:calc(100% + 40px)}
.cover .logo{font-size:2.6rem;font-weight:700;text-shadow:3px 3px 0 var(--cov2)}.cover .bn{font-size:3rem}.cover .s{font-size:.75rem;opacity:.9;margin-top:10px}
.g{position:relative;height:30px;background:var(--cell);border:2px solid var(--line);margin:8px 0 26px}
.g i{position:absolute;top:2px;bottom:2px;display:flex;align-items:center;justify-content:center;color:#fff;font-style:normal;font-size:.68rem;font-weight:700;border:1px solid #0002}
.g b{position:absolute;top:100%;font-size:.62rem;font-weight:400;margin-top:2px;transform:translateX(-50%)}
.pill{display:inline-block;color:#fff;border-radius:6px;padding:0 6px;font-size:.75rem;font-weight:700}
.pm{display:flex;gap:2px;flex-wrap:wrap}
.pc{display:grid;grid-template-columns:1fr 1fr;gap:6px}.pc div{font-size:.8rem;background:var(--cell);padding:5px 7px;border-radius:6px}
.bar{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:14px;width:min(1000px,100%)}
button,select{font:inherit;font-size:.85rem;background:var(--pink);color:#fff;border:0;border-radius:8px;padding:8px 14px;box-shadow:0 3px 0 var(--cov2);cursor:pointer}
select{background:var(--paper);color:var(--ink);box-shadow:0 3px 0 var(--line);max-width:46vw}
button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--cov2)}button:disabled{opacity:.4;cursor:default}
#cnt{font-size:.8rem;min-width:70px;text-align:center}
@media(max-width:760px){.pg.r{display:none}.pg.l{border-radius:10px;height:70vh}.book{padding:8px}}
</style>
</head>
<body>
<h1>🐰 KoPPink Guide Book</h1>
<div class="book" id="book"><div class="pg l" id="L"></div><div class="pg r" id="R"></div></div>
<div class="bar"><button id="pv" aria-label="Halaman sebelumnya">◀</button><select id="toc" aria-label="Daftar isi"></select><span id="cnt"></span><button id="nx" aria-label="Halaman berikutnya">▶</button></div>
<script>
const C={1:"var(--p1)",2:"var(--p2)",3:"var(--p3)",4:"var(--p4)"};
const pill=n=>`<span class="pill" style="background:${C[n]}">P${n}</span>`;
function gantt(g){const T=Math.max(...g.map(s=>s[2]));let h='<div class="g">';
 g.forEach(([p,a,b])=>{h+=`<i style="left:${a/T*100}%;width:${(b-a)/T*100}%;background:${C[p]}">P${p}</i><b style="left:${a/T*100}%">${a}</b>`});
 return h+`<b style="left:100%">${T}</b></div>`}
function res(rows,avg){let h='<div class="tw"><table><tr><th>Proses</th><th>Finish</th><th>Turnaround</th><th>Waiting</th></tr>';
 rows.forEach((r,i)=>h+=`<tr><td>${pill(i+1)}</td><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`);
 return h+`<tr><th colspan="2">Rata-rata</th><th>${avg[0]}</th><th>${avg[1]}</th></tr></table></div>`}
const data=`<div class="tw"><table><tr><th>Proses</th><th>Arrival</th><th>Burst</th></tr><tr><td>P1</td><td>0</td><td>5</td></tr><tr><td>P2</td><td>1</td><td>3</td></tr><tr><td>P3</td><td>2</td><td>8</td></tr><tr><td>P4</td><td>3</td><td>6</td></tr></table></div>`;
function algo(d){return `<h2>${d.n}</h2><p><b>Analogi toko:</b> ${d.a}</p><h3>Cara kerja</h3><ol>${d.s.map(x=>`<li>${x}</li>`).join("")}</ol>${d.x||""}<h3>Gantt Chart</h3>${gantt(d.g)}${res(d.r,d.v)}<p>👍 ${d.pl}</p><p>👎 ${d.mi}</p>`}
const A={
fcfs:{n:"FCFS (First Come First Served)",a:"siapa datang duluan dilayani duluan, seperti antrean kasir biasa. Pelanggan di kasir dituntaskan tanpa disela.",s:["Urutkan pelanggan berdasarkan Arrival Time.","Layani yang paling awal sampai selesai.","Lanjut ke pelanggan berikutnya."],x:`<h3>Data contoh (dipakai semua algoritma)</h3>${data}<div class="note">Jika ada yang seri, urutan bisa berbeda tergantung aturan game. Cocokkan dulu dengan hasil di game.</div>`,g:[[1,0,5],[2,5,8],[3,8,16],[4,16,22]],r:[[5,5,0],[8,7,4],[16,14,6],[22,19,13]],v:["11,25","5,75"],pl:"Sederhana dan adil dari sisi urutan datang.",mi:"Pelanggan dengan belanjaan banyak di depan membuat semua di belakang menunggu lama (convoy effect)."},
sjf:{n:"SJF (Shortest Job First)",a:"saat kasir kosong, pilih pelanggan dengan belanjaan paling sedikit di antara yang mengantre. Tidak menyela pelanggan yang sedang dilayani.",s:["Saat kasir kosong, lihat semua yang sudah tiba.","Pilih Burst Time terkecil.","Layani sampai selesai, ulangi."],x:`<p>Contoh: waktu 5, antre P2 (3), P3 (8), P4 (6) → P2 dulu. Waktu 8: P4 (6) lebih singkat dari P3 (8).</p>`,g:[[1,0,5],[2,5,8],[4,8,14],[3,14,22]],r:[[5,5,0],[8,7,4],[22,20,12],[14,11,5]],v:["10,75","5,25"],pl:"Rata-rata waktu tunggu sangat kecil.",mi:"Proses panjang bisa kelaparan (starvation) jika terus datang proses singkat."},
srtf:{n:"SRTF (Shortest Remaining Time First)",a:"versi SJF yang boleh menyela. Jika pelanggan baru sisa belanjaannya lebih sedikit dari sisa pelanggan di kasir, kasir pindah melayani yang baru.",s:["Setiap ada yang tiba, bandingkan sisa Burst Time.","Yang sisanya paling kecil mendapat kasir.","Yang disela kembali menunggu dengan sisanya."],x:`<p>Contoh: waktu 1, P2 (3) lebih kecil dari sisa P1 (4), jadi P2 menyela.</p>`,g:[[1,0,1],[2,1,4],[1,4,8],[4,8,14],[3,14,22]],r:[[8,8,3],[4,3,0],[22,20,12],[14,11,5]],v:["10,50","5,00"],pl:"Biasanya waktu tunggu rata-rata terkecil.",mi:"Sering ganti pelanggan (context switch) dan proses besar rawan starvation."},
rr:{n:"Round Robin (quantum = 3)",a:"setiap pelanggan dilayani sebesar jatah waktu (quantum). Jika belum selesai, ia kembali ke belakang antrean.",s:["Tentukan quantum (di sini 3).","Layani yang terdepan paling lama sebesar quantum.","Belum selesai? Kembali ke belakang antrean dengan sisanya.","Ulangi sampai semua selesai."],x:`<p>Pelanggan baru yang tiba bersamaan dengan giliran habis ditaruh di depan pelanggan yang disela.</p>`,g:[[1,0,3],[2,3,6],[3,6,9],[4,9,12],[1,12,14],[3,14,17],[4,17,20],[3,20,22]],r:[[14,14,9],[6,5,2],[22,20,12],[20,17,11]],v:["14,00","8,50"],pl:"Adil dan respons cepat untuk semua pelanggan.",mi:"Rata-rata lebih besar. Quantum terlalu kecil = banyak perpindahan, terlalu besar = mirip FCFS."},
pri:{n:"Priority Scheduling",a:"pelanggan VIP didahulukan. Angka prioritas kecil = lebih penting, dan yang sedang dilayani tidak disela.",s:["Saat kasir kosong, lihat yang sedang mengantre.","Pilih prioritas tertinggi (angka terkecil).","Layani sampai selesai, ulangi."],x:`<div class="tw"><table><tr><th>Proses</th><th>Arrival</th><th>Burst</th><th>Priority</th></tr><tr><td>P1</td><td>0</td><td>5</td><td>2</td></tr><tr><td>P2</td><td>1</td><td>3</td><td>4</td></tr><tr><td>P3</td><td>2</td><td>8</td><td>1</td></tr><tr><td>P4</td><td>3</td><td>6</td><td>3</td></tr></table></div><div class="note">Aturan ini perlu dicocokkan dengan game (arah angka prioritas dan apakah boleh menyela).</div>`,g:[[1,0,5],[3,5,13],[4,13,19],[2,19,22]],r:[[5,5,0],[22,21,18],[13,11,3],[19,16,10]],v:["13,25","7,75"],pl:"Proses penting selesai lebih dulu.",mi:"P2 menunggu 18. Prioritas rendah bisa starvation. Solusi: aging, menaikkan prioritas seiring lama menunggu."}};
const gl=[["Proses","Program yang butuh waktu CPU (pelanggan)"],["Ready queue","Antrean proses siap"],["Arrival Time","Waktu tiba"],["Burst Time","Lama dilayani CPU"],["Turnaround","Finish − Arrival"],["Waiting","Turnaround − Burst"],["Time Quantum","Jatah waktu per giliran"],["Preemptive","Boleh menyela proses berjalan"],["Context switch","Perpindahan CPU antar proses"],["CPU idle","CPU menganggur"],["Starvation","Menunggu terlalu lama"],["Aging","Naikkan prioritas yang lama menunggu"]];

["Membaca hasil",`<h2>Membaca Hasil</h2><p><b>Gantt Chart</b> adalah garis waktu siapa dilayani kasir kapan. Celah kosong berarti kasir menganggur (CPU idle).</p><p>Contoh dengan celah (P1 0–2, P2 mulai 6):</p>${gantt([[1,0,2],[2,6,9]])}<h3>Rumus</h3><ul><li>Turnaround = Finish − Arrival</li><li>Waiting = Turnaround − Burst</li><li>Rata-rata = jumlah ÷ jumlah proses</li></ul><div class="note">Contoh: tiba 2, burst 4, selesai 12 → Turnaround 12 − 2 = 10, Waiting 10 − 4 = 6.</div><p>Semakin kecil rata-rata, semakin efisien algoritma untuk data tersebut.</p>`],
["FCFS",algo(A.fcfs)],["SJF",algo(A.sjf)],["SRTF",algo(A.srtf)],["Round Robin",algo(A.rr)],["Priority",algo(A.pri)],
["Perbandingan",`<h2>Perbandingan</h2><p>Hasil dari data contoh yang sama:</p><div class="tw"><table><tr><th>Algoritma</th><th>Turnaround</th><th>Waiting</th><th>Menyela</th></tr><tr><td>FCFS</td><td>11,25</td><td>5,75</td><td>Tidak</td></tr><tr><td>SJF</td><td>10,75</td><td>5,25</td><td>Tidak</td></tr><tr><td>SRTF</td><td>10,50</td><td>5,00</td><td>Ya</td></tr><tr><td>Round Robin</td><td>14,00</td><td>8,50</td><td>Ya</td></tr><tr><td>Priority*</td><td>13,25</td><td>7,75</td><td>Tidak</td></tr></table></div><p style="font-size:.72rem">*Priority memakai data prioritas di halaman Priority.</p><h3>Kapan memakai yang mana</h3><ul><li><b>FCFS:</b> sistem sederhana, urutan datang penting.</li><li><b>SJF/SRTF:</b> waktu tunggu terkecil, lama proses bisa diperkirakan.</li><li><b>Round Robin:</b> sistem interaktif, butuh adil dan respons cepat.</li><li><b>Priority:</b> ada proses yang jelas lebih penting.</li></ul><div class="note">Angka hanya berlaku untuk data contoh. Coba data sendiri di game.</div>`],
["Latihan",`<h2>Latihan</h2><ol><li><b>Celah kosong.</b> P1 (0, burst 2), P2 (6, burst 3). Berapa lama kasir menganggur?</li><li><b>Convoy effect.</b> P1 (0, 20), P2 (1, 2), P3 (2, 2). Bandingkan Waiting FCFS dan SJF.</li><li><b>Efek quantum.</b> Data contoh di Round Robin dengan quantum 1, 3, dan 8. Apa yang berubah?</li><li><b>Starvation.</b> Beri P4 prioritas terendah dan yang lain tinggi dengan waktu tiba berdekatan. Berapa lama P4 menunggu?</li><li><b>Tantangan.</b> Susun data yang membuat FCFS lebih baik daripada Round Robin.</li></ol><div class="note">Jalankan di game, lalu cocokkan dengan hitungan manual.</div>`],
["Glosarium",`<h2>Glosarium</h2><div class="tw"><table>${gl.map(x=>`<tr><th>${x[0]}</th><td>${x[1]}</td></tr>`).join("")}</table></div>`]
];
const L=document.getElementById("L"),R=document.getElementById("R"),cnt=document.getElementById("cnt"),toc=document.getElementById("toc"),pv=document.getElementById("pv"),nx=document.getElementById("nx");
const mq=matchMedia("(max-width:760px)");let p=0,busy=false;
PAGES.forEach((x,i)=>toc.add(new Option(i+1+". "+x[0],i)));
const step=()=>mq.matches?1:2;
const norm=n=>{n=Math.max(0,Math.min(PAGES.length-1,n));return mq.matches?n:n-n%2};
function fill(){const a=PAGES[p],b=mq.matches?null:PAGES[p+1];
 L.innerHTML=a[1]+`<span class="num">${p+1}</span>`;R.innerHTML=b?b[1]+`<span class="num">${p+2}</span>`:"";L.scrollTop=R.scrollTop=0;
 cnt.textContent=(mq.matches||!b?p+1:`${p+1}–${p+2}`)+" / "+PAGES.length;toc.value=p;pv.disabled=p<=0;nx.disabled=p+step()>=PAGES.length}
async function go(n){n=norm(n);if(n===p||busy)return;busy=true;const fwd=n>p;
 const out=fwd?(mq.matches?L:R):L,inn=fwd?L:(mq.matches?L:R);
 const o={duration:200,easing:"ease-in"};
 try{await out.animate([{transform:"rotateY(0)"},{transform:`rotateY(${fwd?-90:90}deg)`}],o).finished}catch(e){}
 p=n;fill();
 try{await inn.animate([{transform:`rotateY(${fwd?90:-90}deg)`},{transform:"rotateY(0)"}],{duration:200,easing:"ease-out"}).finished}catch(e){}
 busy=false}
nx.onclick=()=>go(p+step());pv.onclick=()=>go(p-step());toc.onchange=()=>go(+toc.value);
addEventListener("keydown",e=>{if(e.key==="ArrowRight")nx.click();if(e.key==="ArrowLeft")pv.click()});
mq.addEventListener("change",()=>{p=norm(p);fill()});
fill();
</script>
